# Render Blueprint: sets up Gridline.io with storage and settings in one go.
services:
  - type: web
    name: gridline-io
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/gridline.db
      - key: SANDBOX
        value: "1"
